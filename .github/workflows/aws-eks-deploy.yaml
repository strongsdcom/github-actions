on:
  workflow_call:
    secrets:
      gpg-passphrase:
        required: false
      gpg-private-key:
        required: false
      helm-set-values:
        required: false

    inputs:
      aws-account:
        required: true
        type: string
      aws-region:
        required: true
        type: string
      cluster-name:
        required: true
        type: string
      environment-name:
        required: false
        type: string
        default: ''
      environment-url:
        required: false
        type: string
        default: ''
      gha-role-name:
        required: false
        type: string
        default: 'gha-eks'
      has-secrets:
        required: false
        type: boolean
        default: true
      helm-set-values:
        required: false
        type: string
        default: ''
      helm-values:
        required: true
        type: string
      image-registry:
        required: true
        type: string
      image-repository:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      namespace:
        required: true
        type: string
      release-name:
        required: true
        type: string
      sops-version:
        required: false
        type: string
        default: '3.7.3'

    outputs:
      image-tag:
        description: "Docker image tag name"
        value: ${{ jobs.eks-deploy.outputs.image-tag }}

jobs:
  eks-deploy:
    name: EKS Deploy
    runs-on: [self-hosted, Linux, X64, macmini]
    outputs:
      image-tag: ${{ inputs.image-tag }}
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}
    env:
      GPG_KEY_PRESENT: ${{ secrets.gpg-private-key != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Isolate Helm data home
        run: echo "HELM_DATA_HOME=$RUNNER_TEMP/helm4-data-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Sops Binary Installer
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
        if: ${{ inputs.has-secrets }}
        with:
          version: ${{ inputs.sops-version }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        if: ${{ inputs.has-secrets && env.GPG_KEY_PRESENT == 'true' }}
        with:
          gpg_private_key: ${{ secrets.gpg-private-key }}
          passphrase: ${{ secrets.gpg-passphrase }}

      - name: Install Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v4.2.2

      - name: Trust helm-secrets signing key
        if: ${{ inputs.has-secrets }}
        env:
          HELM_SECRETS_SIGNING_FP: "1F34F95B4F30BC5B06E0D7CC3F619F17002790D8"
        run: |
          curl -sSL https://github.com/jkroepke.gpg | gpg --import
          gpg --list-keys "$HELM_SECRETS_SIGNING_FP"
          gpg --export "$HELM_SECRETS_SIGNING_FP" > "$RUNNER_TEMP/helm-secrets-keyring.gpg"

      - name: Install Helm Secrets
        if: ${{ inputs.has-secrets }}
        run: |
          base="https://github.com/jkroepke/helm-secrets/releases/download/v4.7.7"
          for p in secrets secrets-getter secrets-post-renderer; do
            helm plugin install "$base/$p-4.7.7.tgz" \
              --verify --keyring "$RUNNER_TEMP/helm-secrets-keyring.gpg"
          done

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/${{ inputs.gha-role-name }}
          aws-region: ${{ inputs.aws-region }}
          mask-aws-account-id: false

      - name: Configure EKS
        run: aws eks update-kubeconfig --name ${{ inputs.cluster-name }} --region ${{ inputs.aws-region }}

      - name: Secure kubeconfig permissions
        run: sudo chown $USER $HOME/.kube/config && chmod 600 $HOME/.kube/config

      - name: Build Helm Values
        id: build-helm-values
        env:
          HELM_VALUES_INPUT: ${{ inputs.helm-values }}
          HAS_SECRETS: ${{ inputs.has-secrets }}
        run: |
          helm_values=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$HAS_SECRETS:$(basename "$f")" in
              true:secrets*) helm_values="$helm_values -f secrets://$(realpath "$f")" ;;
              *)             helm_values="$helm_values -f $f" ;;
            esac
          done <<< "$HELM_VALUES_INPUT"
          echo "helm-values=$helm_values" >> "$GITHUB_OUTPUT"

      - name: Build Helm Set Values
        id: build-helm-set-values
        run: |
          helm_set_values_inputs=$(echo '${{ inputs.helm-set-values }}' | sed '/^$/d' | sed 's/.*/--set &/' | sed '$!N;s/\n/ /')
          helm_set_values_secrets=$(echo '${{ secrets.helm-set-values }}' | sed '/^$/d' | sed 's/.*/--set &/' | sed '$!N;s/\n/ /')
          echo 'helm-set-values<<EOF' >> $GITHUB_ENV
          echo  $helm_set_values_inputs $helm_set_values_secrets >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV

      - name: Build DeployedAt
        id: build-deployed-at
        run: echo "deployed-at=$(date +"%Y-%m-%d %T %Z")" >> $GITHUB_OUTPUT

      - name: Helm Upgrade
        run: |
          helm upgrade ${{ inputs.release-name }} ./.deploy --install --rollback-on-failure --wait \
            --namespace ${{ inputs.namespace }} \
            ${{ steps.build-helm-values.outputs.helm-values }} \
            --set image.tag=${{ inputs.image-tag }} \
            --set image.repository=${{ inputs.image-registry }}/${{ inputs.image-repository }} \
            --set deployedBy='ci/cd by ${{ github.actor }}' \
            --set deployedAt='${{ steps.build-deployed-at.outputs.deployed-at }}' \
            ${{ env.helm-set-values }}
